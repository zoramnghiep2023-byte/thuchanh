<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="style.js"></script>
  </head>
  <body>
    <div class="container">
      <h1>New Product</h1>

      <hr />

      <div class="form-row">
        <label>Product Name</label>
        <input type="text" id="productName" value="Quần âu" />

        <label>Quantity</label>
        <input type="number" id="quantity" value="20" />
      </div>

      <div class="form-row">
        <label>Unit Price</label>
        <input type="number" id="unitPrice" value="400000" />

        <label>Discount</label>
        <input type="number" id="discount" value="10" />
      </div>

      <div class="buttons">
        <button onclick="sellProduct()">Sell</button>
        <button onclick="cancelForm()">Cancel</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Product Name</th>
            <th>Quantity</th>
            <th>Unit Price</th>
            <th>Discount</th>
            <th>Subtotal</th>
          </tr>
        </thead>

        <tbody id="productTable">
          <tr>
            <td>1</td>
            <td>Áo thun</td>
            <td>12</td>
            <td>$30000</td>
            <td>10</td>
            <td>$324000</td>
          </tr>

          <tr>
            <td>2</td>
            <td>Quần âu</td>
            <td>20</td>
            <td>$400000</td>
            <td>10</td>
            <td>$7200000</td>
          </tr>
        </tbody>
      </table>
    </div>

    <script src="script.js"></script>
  </body>
</html>
